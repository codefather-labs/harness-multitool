[package]
name = "frontend-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unicode-width = "0.2"
harness-api = { version = "0.1.0-dev", path = "../api" }
serde_json = "1"
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"] }
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
