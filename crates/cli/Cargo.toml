[package]
name = "multitool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
harness-daemon = { version = "0.1.0-dev", path = "../daemon" }
harness-session = { version = "0.1.0-dev", path = "../session" }
harness-core = { version = "0.1.0-dev", path = "../core" }
harness-api = { version = "0.1.0-dev", path = "../api" }
harness-scenarios = { version = "0.1.0-dev", path = "../scenarios" }
frontend-tui = { version = "0.1.0-dev", path = "../frontend-tui" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tui-snapshot = { version = "0.1.0-dev", path = "../tui-snapshot" }
