[package]
name = "harness-memory-journal"
description = "The project journal, mind maps and flowcharts in SQLite (IF-7, CON-20, CON-21, CON-22)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
harness-api = { version = "0.1.0-dev", path = "../api" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
