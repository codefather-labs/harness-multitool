<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multitool · dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#0c0f14; --panel:#151922; --raised:#1d2230; --line:#262d3d; --text:#e8ebf2; --muted:#8a92a6;
    --accent:#7aa2f7; --green:#5fd4b0; --red:#f7768e; --gold:#f2c14e;
    --felt-hi:#1d7a5f; --felt:#11533f; --felt-lo:#0a3528; --rail-hi:#5a3a22; --rail:#3a2414; --rail-lo:#22150b;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:18px; padding:12px 22px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  header h1 span { color:var(--accent); }
  nav button { background:none; border:0; color:var(--muted); font:inherit; padding:6px 12px; border-radius:8px; cursor:pointer; }
  nav button.on { color:var(--text); background:var(--raised); }
  main { padding:20px; max-width:1500px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: 290px minmax(0,1fr); gap:18px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin:0 0 12px; }
  .agent { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .muted { color:var(--muted); }
  button.primary { background:var(--accent); color:#0b0d12; border:0; border-radius:10px; padding:9px 14px; font-weight:600; cursor:pointer; }
  .toggle { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px; background:var(--raised); border-radius:10px; margin-bottom:12px; }
  .switch { position:relative; width:42px; height:24px; flex:none; }
  .switch input { display:none; }
  .switch span { position:absolute; inset:0; background:#394052; border-radius:24px; transition:.2s; cursor:pointer; }
  .switch span:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
  .switch input:checked + span { background:var(--green); }
  .switch input:checked + span:before { transform:translateX(18px); }
  .tables .row { display:flex; justify-content:space-between; align-items:center; padding:9px 10px; border-radius:10px; cursor:pointer; gap:8px; }
  .tables .row:hover, .tables .row.on { background:var(--raised); }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:#2b3243; color:var(--muted); }
  .badge.playing { background:#173a30; color:var(--green); }
  .badge.inviting { background:#3b331d; color:var(--gold); }
  .err { color:var(--red); margin-top:8px; min-height:18px; }
  label.pick { display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:9px; cursor:pointer; }
  label.pick:hover { background:var(--raised); }

  /* The table view (CON-152). */
  .view { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:16px; }
  @media (max-width: 1250px) { .view { grid-template-columns:1fr; } }
  .titlebar { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .titlebar b { font-size:15px; }
  .stage { position:relative; width:100%; padding-top:60%; min-height:420px; user-select:none; }
  .rail { position:absolute; left:7%; right:7%; top:10%; bottom:10%; border-radius:50% / 50%;
    background:radial-gradient(ellipse at 50% 30%, var(--rail-hi), var(--rail) 55%, var(--rail-lo));
    box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12); }
  .felt { position:absolute; inset:4.5% 3.2%; border-radius:50% / 50%;
    background:radial-gradient(ellipse at 50% 42%, var(--felt-hi) 0%, var(--felt) 55%, var(--felt-lo) 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.06), inset 0 10px 40px rgba(0,0,0,.45); overflow:hidden; }
  .felt:after { content:""; position:absolute; inset:9% 7%; border-radius:50%; border:1.5px solid rgba(255,255,255,.07); }
  .mark { position:absolute; left:50%; top:69%; transform:translate(-50%,-50%); font-weight:800; letter-spacing:6px; font-size:clamp(12px,1.4vw,18px); color:rgba(255,255,255,.07); white-space:nowrap; }
  .center { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:10px; z-index:2; }
  .board { display:flex; gap:7px; min-height:var(--ch); }
  .slot { width:var(--cw); height:var(--ch); border-radius:7px; border:1.5px dashed rgba(255,255,255,.12); }
  .pot { display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.35); padding:4px 12px 4px 6px; border-radius:20px; font-weight:700; color:var(--gold); font-size:14px; }
  .pot small { color:rgba(255,255,255,.55); font-weight:500; margin-left:4px; }
  .stage { --cw:clamp(38px,4.3vw,58px); --ch:calc(var(--cw)*1.4); --sw:clamp(30px,2.9vw,40px); }

  /* Cards, drawn in CSS. */
  .c { width:var(--cw); height:var(--ch); border-radius:7px; position:relative; perspective:600px; flex:none; }
  .c .in { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s; }
  .c .face, .c .back { position:absolute; inset:0; border-radius:7px; backface-visibility:hidden; box-shadow:0 3px 8px rgba(0,0,0,.45); }
  .c .face { background:linear-gradient(180deg,#ffffff,#eef0f4); color:#16181d; transform:rotateY(0deg); font-weight:800; }
  .c .back { transform:rotateY(180deg); background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 3px, transparent 3px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 3px, transparent 3px 7px),
      linear-gradient(160deg,#2e4fa3,#1a2c66); border:2px solid #f3f4f8; }
  .c.down .in { transform:rotateY(180deg); }
  .c.red .face { color:#c8243c; }
  .c .r { position:absolute; left:6%; top:3%; font-size:calc(var(--cw)*.36); line-height:1; }
  .c .s1 { position:absolute; left:7%; top:calc(var(--cw)*.38); font-size:calc(var(--cw)*.3); line-height:1; }
  .c .s2 { position:absolute; right:8%; bottom:4%; font-size:calc(var(--cw)*.62); line-height:1; }
  .c.flip .in { animation:flip .65s ease-out both; }
  @keyframes flip { from { transform:rotateY(180deg) translateY(-30px) scale(.8); } 55% { transform:rotateY(90deg) translateY(-6px); } to { transform:rotateY(0) ; } }
  .c.deal { animation:deal .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes deal { from { transform:translate(var(--dx),var(--dy)) rotate(-20deg) scale(.5); opacity:0; } to { transform:none; opacity:1; } }

  /* Seats. */
  .seat { position:absolute; transform:translate(-50%,-50%); width:clamp(124px,11.5vw,162px); z-index:3; text-align:center; }
  .seat .hole { display:flex; justify-content:center; gap:3px; height:calc(var(--ch)*.78); margin-bottom:-14px; position:relative; z-index:1; }
  .seat .hole .c { --cw:clamp(30px,3.3vw,44px); --ch:calc(var(--cw)*1.4); }
  .seat .hole .c:nth-child(1) { transform:rotate(-7deg); } .seat .hole .c:nth-child(2) { transform:rotate(7deg); }
  .seat .hole .c.deal:nth-child(1), .seat .hole .c.deal:nth-child(2) { animation-name:deal; }
  .plate { position:relative; z-index:2; background:linear-gradient(180deg,#232a3a,#141824); border:1.5px solid #39425a; border-radius:12px; padding:6px 8px 6px 46px; min-height:46px; text-align:left; box-shadow:0 6px 16px rgba(0,0,0,.5); }
  .ava { position:absolute; left:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; color:#0b0d12; box-shadow:0 0 0 2px rgba(0,0,0,.4); }
  .plate .n { font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .plate .st { color:var(--gold); font-weight:700; font-size:13px; }
  .tag { position:absolute; right:6px; top:-9px; font-size:10px; font-weight:800; padding:1px 6px; border-radius:8px; background:#3b4258; color:#dfe3ee; }
  .tag.allin { background:var(--red); color:#1a0b10; }
  .seat.turn .plate { border-color:var(--gold); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(242,193,78,.55), 0 6px 16px rgba(0,0,0,.5); } 50% { box-shadow:0 0 0 7px rgba(242,193,78,0), 0 6px 16px rgba(0,0,0,.5); } }
  .seat.folded .plate { opacity:.5; } .seat.folded .hole { visibility:hidden; }
  .seat.out { filter:grayscale(1); opacity:.4; }
  .seat.win .plate { border-color:var(--green); box-shadow:0 0 22px rgba(95,212,176,.7); }
  .banner { position:absolute; left:50%; top:66%; transform:translate(-50%,-50%); z-index:6; background:rgba(8,12,18,.85); border:1px solid rgba(95,212,176,.6); color:var(--text); padding:7px 14px; border-radius:12px; font-weight:600; white-space:nowrap; animation:pop .4s ease-out both; }
  @keyframes pop { from { transform:translate(-50%,-50%) scale(.7); opacity:0; } to { transform:translate(-50%,-50%) scale(1); opacity:1; } }

  /* Chips. */
  .bet { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:5px; z-index:2; font-weight:700; font-size:12px; color:#fff; text-shadow:0 1px 2px #000; }
  .stack { position:relative; width:var(--sw); height:calc(var(--sw)*.9); }
  .chip { position:absolute; left:0; width:var(--sw); height:calc(var(--sw)*.42); border-radius:50%;
    background:radial-gradient(circle at 50% 45%, var(--cc) 52%, #fff 53% 58%, var(--cc) 59%);
    box-shadow:0 2px 0 rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.25); }
  .dealer { position:absolute; transform:translate(-50%,-50%); width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#fff,#d9dce4); color:#1a1d24; font-weight:900; font-size:12px; display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.6); z-index:3; transition:left .6s, top .6s; }
  .blind { position:absolute; left:6px; top:-9px; font-size:10px; font-weight:800; padding:1px 6px; border-radius:8px; background:#e8ebf2; color:#141720; }

  /* What happens: bubbles, chips in flight. */
  .bubble { position:absolute; transform:translate(-50%,-50%); z-index:7; background:#f4f6fb; color:#141720; font-weight:700; font-size:12px; padding:4px 10px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.45); white-space:nowrap; animation:bubble 2.6s ease-out both; pointer-events:none; }
  .bubble.fold { background:#535a6e; color:#e8ebf2; } .bubble.raise { background:var(--gold); } .bubble.allin { background:var(--red); }
  @keyframes bubble { 0% { opacity:0; transform:translate(-50%,-30%) scale(.8); } 12% { opacity:1; transform:translate(-50%,-80%) scale(1); } 80% { opacity:1; transform:translate(-50%,-95%); } 100% { opacity:0; transform:translate(-50%,-120%); } }
  .fly { position:absolute; z-index:8; transform:translate(-50%,-50%); transition:left .7s cubic-bezier(.3,.6,.3,1), top .7s cubic-bezier(.3,.6,.3,1), opacity .3s .6s; pointer-events:none; }

  .history { max-height:560px; overflow:auto; font:12px/1.55 ui-monospace, SFMono-Regular, monospace; }
  .history div { padding:3px 6px; border-radius:6px; }
  .history div.new { animation:hl 1.6s ease-out; }
  @keyframes hl { from { background:rgba(122,162,247,.25); } to { background:transparent; } }
  .history .k-board { color:var(--accent); } .history .k-hand_ended { color:var(--green); } .history .k-hand { color:var(--gold); }
  .waiting { padding:40px 10px; text-align:center; }
  #conn { font-size:12px; padding:2px 9px; border-radius:10px; }
  #conn.live { background:#173a30; color:var(--green); } #conn.down { background:#3b1d24; color:var(--red); }
  .spot { display:contents; }
</style>
</head>
<body>
<header>
  <h1><span>multitool</span> dashboard</h1>
  <nav><button id="t-overview" class="on">Overview</button><button id="t-games">Games</button></nav>
  <div style="margin-left:auto;display:flex;gap:14px;align-items:center"><span id="conn" class="down">connecting…</span><span class="muted" id="clock"></span></div>
</header>
<main>
  <section id="overview">
    <div class="card"><h2>Agents online</h2><div id="agents" class="muted">…</div></div>
  </section>
  <section id="games" hidden>
    <div class="grid">
      <div>
        <div class="card">
          <h2>Games</h2>
          <div class="toggle"><div><b>Games between agents</b><div class="muted">Texas hold'em, play money</div></div><label class="switch"><input type="checkbox" id="enabled"><span></span></label></div>
          <h2>New table</h2>
          <div id="pick" class="muted">…</div>
          <button class="primary" id="create" style="margin-top:10px;width:100%">Invite to a poker table</button>
          <div class="err" id="err"></div>
        </div>
        <div class="card tables" style="margin-top:18px"><h2>Tables</h2><div id="tables" class="muted">none yet</div></div>
      </div>
      <div class="card" id="tablecard">
        <div class="titlebar"><b id="tt">Table</b><span class="muted" id="tsub"></span></div>
        <div id="table" class="muted waiting">Choose a table, or invite agents to a new one.</div>
      </div>
    </div>
  </section>
</main>
<script>
// The dashboard (ADR 0029, CON-152 as journal#1039 has it): the daemon pushes on a WebSocket, and
// a table's DOM is built once and then changed in place, only where something changed.
const token = new URLSearchParams(location.search).get("token") || "";
const api = (p, opts) => fetch(`/dashboard/api/${p}${p.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`, opts).then(r => r.json());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const setText = (e, text) => { text = String(text); if (e.textContent !== text) e.textContent = text; };
const setHtml = (e, key, html) => { if (e.dataset.key !== key) { e.dataset.key = key; e.innerHTML = html; return true; } return false; };
function tab(name) { for (const n of ["overview","games"]) { $(n).hidden = n !== name; $("t-"+n).classList.toggle("on", n === name); } }
$("t-overview").onclick = () => tab("overview"); $("t-games").onclick = () => tab("games");
let current = location.hash.slice(1) || null;
if (current) tab("games");

// What the daemon has told us.
const tables = new Map();           // id -> {table, feed}
let agents = [], settingsNow = {};
const name = a => a.nick || a.title || a.id;

// ---- The socket ----------------------------------------------------------------------------
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/dashboard/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "live"; };
  ws.onmessage = m => {
    const msg = JSON.parse(m.data);
    if (msg.type === "hello") { settingsNow = msg.settings || {}; $("enabled").checked = !!settingsNow.enabled; }
    else if (msg.type === "agents") { agents = msg.agents || []; drawAgents(); }
    else if (msg.type === "table") { const before = tables.get(msg.table.id); tables.set(msg.table.id, msg); drawList(); if (!current || (msg.table.id === current && table.id !== current)) select(msg.table.id); else if (msg.table.id === current) table.update(msg, before); }
  };
  ws.onclose = async () => {
    $("conn").textContent = "reconnecting…"; $("conn").className = "down";
    // A daemon started anew has a new token: this address no longer opens it.
    const known = await fetch(`/dashboard/api/settings?token=${encodeURIComponent(token)}`).then(r => r.status !== 401).catch(() => true);
    if (!known) { $("conn").textContent = "the daemon restarted: open the address `multitool dashboard` prints now"; return; }
    setTimeout(connect, 2000);
  };
}

// ---- The side: agents, the games toggle, a new table, the tables --------------------------
function drawAgents() {
  $("agents").innerHTML = agents.length ? agents.map(a => `<div class="agent"><span class="dot"></span><b>${esc(name(a))}</b><span class="muted">${esc(a.title)}</span></div>`).join("") : "No agent is online.";
  const picked = new Set([...document.querySelectorAll("#pick input:checked")].map(i => i.value));
  $("pick").innerHTML = agents.length ? agents.map(a => `<label class="pick"><input type="checkbox" value="${esc(a.id)}" ${picked.has(a.id) ? "checked" : ""}> ${esc(name(a))}</label>`).join("") : "No agent is online to invite.";
}
$("enabled").onchange = async e => { settingsNow = { ...settingsNow, enabled: e.target.checked }; await api("settings", { method: "POST", body: JSON.stringify(settingsNow) }); };
$("create").onclick = async () => {
  const players = [...document.querySelectorAll("#pick input:checked")].map(i => i.value);
  const r = await api("tables", { method: "POST", body: JSON.stringify({ game: "texas_holdem", players }) });
  $("err").textContent = r.error || ""; if (r.table) select(r.table);
};
function drawList() {
  const list = [...tables.values()].map(m => m.table).sort((a, b) => b.id.localeCompare(a.id, undefined, { numeric: true }));
  const box = $("tables");
  if (!list.length) { box.textContent = "none yet"; return; }
  if (box.firstChild && box.firstChild.nodeType === 3) box.textContent = "";
  for (const t of list) {
    let row = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if (!row) { row = el("div", "row"); row.dataset.id = t.id; row.innerHTML = `<span><b></b> <span class="muted"></span></span><span class="badge"></span>`; row.onclick = () => select(t.id); box.appendChild(row); }
    setText(row.querySelector("b"), t.id); setText(row.querySelector(".muted"), t.invited.map(p => p.nick).join(", "));
    const badge = row.querySelector(".badge"); setText(badge, t.state); badge.className = `badge ${t.state}`;
    row.classList.toggle("on", t.id === current);
  }
}
function select(id) { current = id; location.hash = id; drawList(); table.build(tables.get(id)); }

// ---- Cards and chips -----------------------------------------------------------------------
const RANKS = "23456789TJQKA", SUITS = ["♠","♥","♦","♣"];
const cardOf = c => typeof c === "number" ? { r: RANKS[c >> 2], s: SUITS[c & 3] } : { r: c.slice(0, -1), s: c.slice(-1) };
function cardHtml(c, cls = "", style = "") {
  if (c == null) return `<div class="c down ${cls}" style="${style}"><div class="in"><div class="face"></div><div class="back"></div></div></div>`;
  const { r, s } = cardOf(c); const red = s === "♥" || s === "♦";
  return `<div class="c ${red ? "red" : ""} ${cls}" style="${style}"><div class="in"><div class="face"><span class="r">${esc(r === "T" ? "10" : r)}</span><span class="s1">${esc(s)}</span><span class="s2">${esc(s)}</span></div><div class="back"></div></div></div>`;
}
const DENOMS = [[1000,"#2b2b33"],[500,"#7c3aed"],[100,"#111827"],[25,"#16a34a"],[5,"#dc2626"],[1,"#e5e7eb"]];
function chipsHtml(amount) {
  const chips = []; let left = amount;
  for (const [d, col] of DENOMS) while (left >= d && chips.length < 8) { chips.push(col); left -= d; }
  if (!chips.length) chips.push("#e5e7eb");
  return `<div class="stack">${chips.map((col, i) => `<div class="chip" style="--cc:${col};bottom:${i * 3}px"></div>`).join("")}</div>`;
}
const hue = s => [...String(s)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
const initials = s => String(s).split(/[-_ .]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "?";
function spot(i, n) { const a = Math.PI / 2 + (2 * Math.PI * i) / n; return [50 + 43 * Math.cos(a), 50 + 41 * Math.sin(a)]; }
const toward = ([x, y], k) => [50 + (x - 50) * k, 50 + (y - 50) * k];
const place = (e, [x, y]) => { const l = x.toFixed(2) + "%", t = y.toFixed(2) + "%"; if (e.style.left !== l) e.style.left = l; if (e.style.top !== t) e.style.top = t; };

// ---- The table: built once, then changed in place ------------------------------------------
const table = {
  id: null, parts: null, seen: new Set(), hold: null, histHand: null,
  build(msg) {
    this.id = msg?.table.id ?? null; this.parts = null; this.seen = new Set(); this.hold = null; this.histHand = null;
    $("table").className = "muted waiting"; $("table").textContent = msg ? "" : "Choose a table, or invite agents to a new one.";
    if (msg) this.update(msg, null, true);
  },
  // The DOM of a table that plays: the stage, its seats and the board's five places.
  skeleton(v) {
    const root = $("table"); root.className = ""; root.innerHTML = "";
    const view = el("div", "view"), left = el("div"), stage = el("div", "stage");
    stage.innerHTML = `<div class="rail"><div class="felt"><div class="mark">MULTITOOL · HOLD'EM</div></div></div>`;
    const center = el("div", "center"), board = el("div", "board"), pot = el("div", "pot");
    const slots = [0,1,2,3,4].map(() => { const s = el("div", "spot"); s.innerHTML = `<div class="slot"></div>`; board.appendChild(s); return s; });
    center.append(board, pot); stage.appendChild(center);
    const n = v.players.length, seats = {}, bets = {}, blinds = {};
    v.players.forEach((p, i) => {
      const at = spot(i, n), seat = el("div", "seat"); place(seat, at);
      seat.innerHTML = `<div class="hole"></div><div class="plate"><div class="ava" style="background:hsl(${hue(p.player)} 70% 62%)">${esc(initials(p.player))}</div><span class="blind" hidden></span><span class="tag" hidden></span><div class="n">${esc(p.player)}</div><div class="st"></div><div class="hn muted" style="font-size:11px"></div></div>`;
      const bet = el("div", "bet"); bet.hidden = true; place(bet, toward(at, 0.62)); bet.innerHTML = `<span class="chips"></span><span class="amt"></span>`;
      stage.append(seat, bet);
      seats[p.player] = { el: seat, at, hole: seat.querySelector(".hole"), st: seat.querySelector(".st"), tag: seat.querySelector(".tag"), hn: seat.querySelector(".hn") };
      bets[p.player] = { el: bet, chips: bet.querySelector(".chips"), amt: bet.querySelector(".amt") }; blinds[p.player] = seat.querySelector(".blind");
    });
    const dealer = el("div", "dealer", "D"); stage.appendChild(dealer);
    const banner = el("div", "banner"); banner.hidden = true; stage.appendChild(banner);
    left.appendChild(stage);
    const side = el("div", "card"); side.style.padding = "12px"; side.innerHTML = `<h2>This hand</h2>`; const hist = el("div", "history"); side.appendChild(hist);
    view.append(left, side); root.appendChild(view);
    this.parts = { stage, slots, pot, seats, bets, blinds, dealer, banner, hist, players: v.players.map(p => p.player).join("|") };
  },
  update(msg, before, first = false) {
    if (!msg || msg.table.id !== this.id) return;
    const t = msg.table, v = t.view, feed = msg.feed || { events: [], previous: [], hand: 0 };
    setText($("tt"), `Table ${t.id}`);
    setText($("tsub"), v ? `Texas hold'em · blinds ${t.rules.small_blind}/${t.rules.big_blind} · hand ${v.hand} of ${v.max_hands} · ${t.state}` : t.state);
    if (!v) { $("table").className = "muted waiting"; setText($("table"), `Waiting for answers: ${t.invited.map(p => `${p.nick} ${p.joined ? "✓" : p.declined ? "✗" : "…"}`).join(", ")}`); return; }
    if (!this.parts || this.parts.players !== v.players.map(p => p.player).join("|")) this.skeleton(v);
    // What is new since the last message: animated once; the first message only draws.
    const keyOf = (h, e) => `${h}:${e.seq}`;
    const all = [...feed.previous.map(e => [keyOf(feed.hand - 1, e), e]), ...feed.events.map(e => [keyOf(feed.hand, e), e])];
    const fresh = all.filter(([k]) => !this.seen.has(k)).map(([, e]) => e);
    all.forEach(([k]) => this.seen.add(k));
    const news = first ? [] : fresh;
    const ended = news.find(e => e.kind === "hand_ended") || (first ? feed.previous.find(e => e.kind === "hand_ended" && Date.now() - e.at_ms < 6000) : null);
    if (ended) { this.hold = { until: Date.now() + 5200, ev: ended, played: false }; setTimeout(() => this.update(tables.get(this.id), null), 5300); }
    if (this.hold && Date.now() > this.hold.until) this.hold = null;
    this.draw(v, feed, news);
  },
  draw(v, feed, news) {
    const P = this.parts, hold = this.hold;
    const shown = hold ? Object.fromEntries((hold.ev.data.shown || []).map(s => [s.player, s])) : {};
    const winners = hold ? new Set((hold.ev.data.winners || []).map(w => w.player)) : new Set();
    // The board: a card added is turned up; one already there is left alone.
    const board = hold ? (hold.ev.data.board || []) : (v.board_cards || []);
    const flipped = news.filter(e => e.kind === "board").length;
    const firstNew = flipped ? Math.max(0, board.length - (board.length === 3 ? 3 : flipped)) : 99;
    P.slots.forEach((slot, k) => { const c = board[k]; setHtml(slot, String(c ?? "-"), c == null ? `<div class="slot"></div>` : cardHtml(c, k >= firstNew ? "flip" : "", k >= firstNew ? `animation-delay:${(k - firstNew) * 0.18}s` : "")); });
    // The pot, and the side pots.
    const pots = v.pots || [];
    if (hold) { const won = (hold.ev.data.winners || []).reduce((a, w) => a + (w.won || 0), 0); setHtml(P.pot, `w${won}`, `${chipsHtml(won)}<span>${won}</span>`); }
    else setHtml(P.pot, `p${v.pot}|${pots.map(p => p.amount).join(",")}`, `${chipsHtml(v.pot)}<span>Pot ${v.pot}</span>${pots.length > 1 ? `<small>${pots.map((p, k) => `${k ? "side" : "main"} ${p.amount}`).join(" · ")}</small>` : ""}`);
    // The seats.
    const dealtNow = news.some(e => e.kind === "hand");
    const n = v.players.length;
    v.players.forEach((p, i) => {
      const s = P.seats[p.player]; if (!s) return;
      s.el.classList.toggle("turn", !hold && p.player === v.to_act);
      s.el.classList.toggle("folded", !!p.folded && !shown[p.player]);
      s.el.classList.toggle("out", !!p.out);
      s.el.classList.toggle("win", winners.has(p.player));
      setText(s.st, p.stack);
      const tag = p.all_in ? "ALL IN" : p.folded ? "FOLD" : p.out ? "OUT" : "";
      s.tag.hidden = !tag; setText(s.tag, tag); s.tag.classList.toggle("allin", !!p.all_in);
      const mine = shown[p.player]; setText(s.hn, mine ? mine.hand : "");
      const live = !p.folded && !p.out && v.hand > 0;
      const [dx, dy] = [(50 - s.at[0]) * 7, (50 - s.at[1]) * 5];
      const holeKey = mine ? `shown:${mine.cards}` : live ? `down:${v.hand}` : "none";
      setHtml(s.hole, holeKey, mine ? (mine.cards_list || []).map(c => cardHtml(c, "flip")).join("")
        : live ? [0,1].map(k => cardHtml(null, dealtNow ? "deal" : "", `--dx:${dx}px;--dy:${dy}px;animation-delay:${(i + k * n) * 0.08}s`)).join("") : "");
      const b = P.bets[p.player], amount = hold ? 0 : p.bet;
      b.el.hidden = !(amount > 0);
      if (amount > 0) { setHtml(b.chips, String(amount), chipsHtml(amount)); setText(b.amt, amount); }
      const roles = p.roles || [];
      if (roles.includes("button")) { const [x, y] = toward(s.at, 0.8); place(P.dealer, [x + (x <= 50 ? 8 : -8), y]); }
      const blind = roles.includes("small_blind") ? "SB" : roles.includes("big_blind") ? "BB" : "";
      P.blinds[p.player].hidden = !blind; setText(P.blinds[p.player], blind);
    });
    // The banner of a hand's end.
    // Who won what; the hands shown are named at their seats.
    P.banner.hidden = !hold;
    if (hold) setText(P.banner, (hold.ev.data.winners || []).map(w => `${w.player} wins ${w.won}${w.with ? " with " + w.with : ""}`).join(" · ") || "the hand is over");
    // The history: this hand's lines, new ones added at the end.
    if (this.histHand !== feed.hand) { this.histHand = feed.hand; P.hist.innerHTML = ""; P.hist.dataset.n = "0"; }
    const shownN = Number(P.hist.dataset.n || 0);
    feed.events.slice(shownN).forEach(e => { const line = el("div", `k-${e.kind} ${news.includes(e) ? "new" : ""}`); line.textContent = e.text.replace(/^Hand \d+(, )?:? ?/, ""); P.hist.appendChild(line); });
    P.hist.dataset.n = String(feed.events.length); P.hist.scrollTop = P.hist.scrollHeight;
    // What just happened, over the table, once.
    news.filter(e => e.kind === "acted").forEach((e, k) => {
      const s = P.seats[e.data.player]; if (!s) return;
      const word = String(e.data.action || "");
      const cls = word.startsWith("fold") ? "fold" : /^(raise|bet)/.test(word) ? "raise" : word.includes("all") ? "allin" : "";
      const bub = el("div", `bubble ${cls}`); bub.textContent = word; place(bub, [s.at[0], s.at[1] - 13]); bub.style.animationDelay = (k * 0.35) + "s";
      P.stage.appendChild(bub); setTimeout(() => bub.remove(), 3200 + k * 350);
      if (/^(call|bet|raise|all)/.test(word)) fly(P.stage, s.at, toward(s.at, 0.62), 50, k * 0.35);
    });
    if (hold && !hold.played) { hold.played = true; for (const w of (hold.ev.data.winners || [])) { const s = P.seats[w.player]; if (s) fly(P.stage, [50, 52], s.at, w.won, 0.3); } }
  },
};
function fly(stage, from, to, amount, delay = 0) {
  const f = el("div", "fly", chipsHtml(Math.max(1, amount))); place(f, from); stage.appendChild(f);
  setTimeout(() => { place(f, to); f.style.opacity = "0"; }, 30 + delay * 1000);
  setTimeout(() => f.remove(), 1400 + delay * 1000);
}

setInterval(() => setText($("clock"), new Date().toLocaleTimeString()), 1000);
connect();
</script>
</body>
