[package]
name = "harness-daemon"
description = "The daemon: the single entry point of callbacks to agents, a URL per window (CON-20, IF-13, IF-16)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
harness-api = { version = "0.1.0-dev", path = "../api" }
harness-memory-journal = { version = "0.1.0-dev", path = "../memory-journal" }
harness-games = { version = "0.1.0-dev", path = "../games" }
pollster = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tiny_http = "0.12"
sha1 = "0.10"
base64 = "0.22"
toml = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
