<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 44"
     fill="none"
     stroke="currentColor"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Four-tine fork -->
  <path
    d="M39 22 H32
       Q28 22 28 18
       V12
       H3
       M28 17 H3
       M28 22 H3
       M28 27 H3
       M28 22 Q28 32 39 32"
    stroke-width="3.5"/>

  <!-- Saw with triangular teeth -->
  <path
    d="M101 18
       H108
       L113 9
       L118 16
       L123 7
       L128 15
       L133 6
       L138 14
       L143 7
       L148 16
       L155 18
       V28
       H101 Z"
    fill="currentColor"
    stroke="none"/>

  <!-- Horizontal handle -->
  <rect
    x="38" y="15"
    width="76" height="23"
    rx="11.5"
    stroke-width="3"/>

  <!-- Handle highlight line -->
  <path
    d="M64 19 H97"
    stroke-width="1.8"/>

  <!-- Pivot and rivet -->
  <circle cx="52" cy="26.5" r="4.5"
          stroke-width="2.5"/>
  <circle cx="101" cy="26.5" r="3.5"
          stroke-width="2.5"/>
</svg>
