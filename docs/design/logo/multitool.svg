<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 530 82">
  <!-- harness-multitool logo, traced from docs/design/concept/startup-light.png (operator's pick).
       Colours as drawn for the light theme. The TUI recolours them per theme:
         #20242A  tools (fork, saw)     -> theme text
         #1A1D22  ink (outline, rivets) -> theme text on light themes, theme background on dark
         #F5A623  handle                -> brand -->
  <defs>
    <!-- The fork is one silhouette with three rounded slots cut out between the tines. -->
    <mask id="slots" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="100">
      <rect x="0" y="0" width="200" height="100" fill="#fff"/>
      <rect x="2" y="23" width="88" height="8" rx="4" fill="#000"/>
      <rect x="2" y="41" width="88" height="8" rx="4" fill="#000"/>
      <rect x="2" y="59" width="88" height="8" rx="4" fill="#000"/>
    </mask>
  </defs>

  <!-- Fork: tines with round tips, a solid head, a waist that runs under the handle -->
  <path fill="#20242A" mask="url(#slots)"
        d="M20 13 L92 12 C104 11 108 17 114 24 C118 29 122 32 132 32 L132 62
           C122 62 118 65 114 70 C108 77 104 79 92 78 L20 77
           A5 5 0 0 1 20 67 L22 67 L22 23 L20 23 A5 5 0 0 1 20 13 Z"/>
  <!-- The round tips of the two inner tines (the outer ones come with the silhouette) -->
  <g fill="#20242A">
    <rect x="15" y="31" width="20" height="10" rx="5"/>
    <rect x="15" y="49" width="20" height="10" rx="5"/>
  </g>

  <!-- Saw: blade under the handle's right end, a thin hook with a notch, three teeth, round tip -->
  <path fill="#20242A"
        d="M370 37 L400 37 L415 19 Q419 14 422 18 L418 26 L430 40 L445 26 L462 40 L478 26 L493 40 L508 26
           L528 46 Q535 54 526 62 L370 63 Z"/>

  <!-- Handle -->
  <rect x="127" y="23" width="260" height="60" rx="30" fill="#F5A623" stroke="#1A1D22" stroke-width="3"/>
  <rect x="183" y="35" width="147" height="6" rx="3" fill="#FFE3B0" opacity="0.85"/>

  <!-- Rivets -->
  <circle cx="155" cy="53" r="11" fill="#1A1D22"/>
  <circle cx="360" cy="53" r="11" fill="#1A1D22"/>
</svg>
