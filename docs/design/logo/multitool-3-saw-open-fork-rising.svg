<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- harness-multitool logo, frame 3-saw-open-fork-rising: saw -60 deg, fork -50 deg around the pivot (66,190).
       Tools are drawn behind the handle, so folded (0 deg) they are hidden inside it. -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-50 66 190)">
      <!-- Fork: a neck, a head and four tines -->
      <g stroke-width="1.8">
        <path d="M72 187 L144 187 L158 179 L158 203 L144 195 L72 195 Z M158 179 L202 179 L202 182 L158 182 Z M158 186 L202 186 L202 189 L158 189 Z M158 193 L202 193 L202 196 L158 196 Z M158 200 L202 200 L202 203 L158 203 Z" fill="#F2F2ED"/>
      </g>
    </g>
    <g transform="rotate(-60 66 190)">
      <!-- Saw: a wide blade, big triangular teeth along its upper edge -->
      <path d="M72 183 L84 183 L90 174 L96 183 L96 183 L102 174 L108 183 L108 183 L114 174 L120 183 L120 183 L126 174 L132 183 L132 183 L138 174 L144 183 L144 183 L150 174 L156 183 L156 183 L162 174 L168 183 L168 183 L174 174 L180 183 L180 183 L186 174 L192 183 L192 183 L198 174 L204 183 L208 183 L221 191.5 L208 200 L72 200 Z" fill="#F2F2ED"/>
    </g>
    <!-- Horizontal handle -->
    <path d="M48 171 Q36 171 36 183 L36 197 Q36 209 48 209 L218 209 Q232 209 232 195 L232 185 Q232 171 218 171 Z" fill="#F5A623"/>
    <!-- Handle highlight -->
    <path d="M83 179 L211 179" fill="none" stroke="#FFE0A0" stroke-width="3.5"/>
    <!-- Fixed pivot -->
    <circle cx="66" cy="190" r="10" fill="#F5A623" stroke="currentColor" stroke-width="5"/>
    <circle cx="66" cy="190" r="3.5" fill="#FFE0A0" stroke="none"/>
  </g>
</svg>
