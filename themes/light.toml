# themes/light.toml — harness-multitool theme. Contrast (WCAG 2.x, checked by script):
#   text on background 14.94:1, text_muted on background 6.50:1, text_muted on surface_raised 5.33:1, accent_text on accent 5.18:1
name = "Light"
kind = "light"
note = "Warm off-white theme with accessible burnt-orange accents."

background = "#FBFAF8"
surface = "#F1F0EE"
surface_raised = "#E5E4E1"
overlay_scrim = "#85817E"
border_subtle = "#D2D0CB"
text = "#20242A"
text_muted = "#535C68"
accent = "#A65900"
accent_text = "#FFFFFF"
success = "#1E7549"
warning = "#8C5300"
error = "#A32F45"
info = "#165C9B"
diff_add_bg = "#E1F3E9"
diff_del_bg = "#FBE5E8"
selection = "#FBE0B8"
accent_line = "#C97400"   # stripes, focus borders: 3.37:1 on background, 3.08:1 on surface (non-text minimum 3:1); accent #A65900 stays for orange text

brand = "#F5A623"   # the multitool logo, the same in every theme
