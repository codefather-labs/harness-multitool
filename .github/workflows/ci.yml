name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --workspace --no-fail-fast
      # INV-1: the core and the interfaces build for the browser.
      - run: cargo check -p harness-api -p harness-core --target wasm32-unknown-unknown
      # CON-184: the terminal interface builds for the browser, for the site's in-page multitool.
      - run: cargo build -p frontend-tui --target wasm32-unknown-unknown
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build without Claude Code as a delegate still builds clean (--no-claude-code).
      - run: cargo clippy -p multitool --no-default-features --all-targets -- -D warnings
      - run: cargo run -q -p multitool -- docs check
  # CON-5: the other native targets build (the TLS library needs each OS's own toolchain).
  other-targets:
    strategy:
      # Each OS says what fails on it, whatever the other one does.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --no-fail-fast
