# Makes every release of the multitool (CON-194): when CI succeeds on main, or by hand. It builds
# the four targets and makes the tag v<version> with its GitHub Release holding every bundle,
# marked Latest (CON-193). Every installer downloads from that Release (CON-195): the site's
# install lines, install.sh and install.ps1. install-check then installs it each of those ways on
# Linux, macOS and Windows and wants that release's exact binary.
#
# A version is published once: one released already is not built again. Releases are immutable
# here, so the Release gets all its files when it is made, and only after every target was built.
name: release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  lint:
    # A push to main whose CI passed; a run by hand releases the head of the branch it is run on.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
  version:
    needs: lint
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)+$(git rev-parse --short HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is released already: nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$v at $sha"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: version
    if: needs.version.outputs.released != 'true'
    strategy:
      # Every target is built to the end, so one run says all that fails; the release needs all four.
      fail-fast: false
      matrix:
        include:
          # Linux in rust:1-bullseye: glibc 2.31, so the binary runs on every glibc the install
          # line accepts (CON-186); package-bundle.sh refuses a newer one.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: rust:1-bullseye
            exe: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: rust:1-bullseye
            exe: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            container: ''
            exe: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            container: ''
            exe: .exe
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Rust
        if: matrix.container == ''
        run: rustup default stable
      - name: Build
        run: cargo build --release --locked -p multitool
      - name: Smoke test
        run: target/release/multitool${{ matrix.exe }} --version
      - name: Package
        run: bash scripts/package-bundle.sh "${{ matrix.target }}" "${{ needs.version.outputs.version }}" "target/release/multitool${{ matrix.exe }}" bundles
      # The zip installs as a user would install it: unpacked, install.ps1 -Local -NoBuild.
      - name: Install the Windows zip
        if: matrix.exe == '.exe'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'multitool-zip'
          Expand-Archive -Path "bundles/multitool-$env:VERSION-x86_64-pc-windows-msvc.zip" -DestinationPath $dir
          & (Join-Path $dir 'install.ps1') -Local -NoBuild -Yes -NoService -NoAgentSetup
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $exe = Join-Path $env:LOCALAPPDATA 'harness-multitool\bin\multitool.exe'
          # The installed file is the zip's, byte for byte; the binary says its Cargo version (the
          # commit is in the bundle's VERSION).
          $packed = (Get-FileHash (Join-Path $dir 'target\release\multitool.exe')).Hash
          $installed = (Get-FileHash $exe).Hash
          if ($packed -ne $installed) { throw "the installed multitool.exe ($installed) is not the zip's ($packed)" }
          $said = & $exe --version
          $cargo = $env:VERSION.Split('+')[0]
          Write-Host "installed: $said, sha256 $installed"
          if ("$said" -ne "multitool $cargo") { throw "the installed multitool says $said, not multitool $cargo" }
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: bundles/
          if-no-files-found: error
  publish:
    needs: [version, build]
    if: needs.version.outputs.released != 'true'
    runs-on: ubuntu-24.04
    permissions:
      # The tag and its GitHub Release.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Check the bundles
        run: |
          ls -la bundles
          test "$(find bundles -name 'multitool-*' ! -name '*.sha256' | wc -l)" = 4
          (cd bundles && sha256sum -c ./*.sha256)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          previous="$(git tag -l 'v*' --merged "$SHA" --sort=-creatordate | grep -vx "$tag" | sed -n 1p || true)"
          {
            echo "multitool $VERSION, built from $(git rev-parse --short "$SHA") of main."
            echo
            echo "Linux and macOS:"
            echo
            echo '```'
            echo "curl --proto '=https' --tlsv1.2 -sSf https://harness-multitool.dev/install.sh | sh"
            echo '```'
            echo
            echo "Windows: unpack multitool-$VERSION-x86_64-pc-windows-msvc.zip, then in it:"
            echo
            echo '```'
            echo '.\install.ps1 -Local -NoBuild'
            echo '```'
            echo
            if [ -n "$previous" ]; then echo "Changes since $previous:"; else echo "Changes:"; fi
            echo
            # --max-count, not head: with pipefail a closed pipe would end the step (SIGPIPE).
            git log --no-merges --max-count=200 --format='- %s (%h)' ${previous:+"$previous"..}"$SHA"
          } > notes.md
          # Marked Latest, so the repository's page and /releases/latest lead to the newest build for
          # every OS; each version keeps its own tag and title (journal#1600).
          gh release create "$tag" bundles/* -R "$GITHUB_REPOSITORY" --target "$SHA" --title "multitool $VERSION" --notes-file notes.md --latest
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[].name]}'
  # Each install line and script installs this release's exact binary (CON-195).
  install-check:
    needs: [version, publish]
    if: needs.version.outputs.released != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - name: The site's line and install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
            macOS-arm64) target=aarch64-apple-darwin ;;
            *) echo "no release build for $RUNNER_OS $(uname -m)"; exit 1 ;;
          esac
          enc="${VERSION//+/%2B}"
          curl -fsSL -o bundle.tgz "https://github.com/$GITHUB_REPOSITORY/releases/download/v$enc/multitool-$enc-$target.tar.gz"
          mkdir bundle && tar -xzf bundle.tgz -C bundle
          want="$(shasum -a 256 bundle/target/release/multitool | cut -d' ' -f1)"
          bin="$HOME/.local/share/harness-multitool/bin/multitool"
          check() {
            have="$(shasum -a 256 "$bin" | cut -d' ' -f1)"
            echo "$1: installed $have, release $want, says: $("$bin" --version)"
            test "$have" = "$want"
            test "$("$bin" --version)" = "multitool ${VERSION%%+*}"
            rm -f "$bin"
          }
          curl --proto '=https' --tlsv1.2 -sSf https://harness-multitool.dev/install.sh | sh -s -- --yes --no-service --no-agent-setup
          check "the site's line"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SHA/install.sh" | bash -s -- --yes --no-service --no-agent-setup
          check "install.sh from GitHub"
      - name: The site's line and install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $enc = $env:VERSION.Replace('+', '%2B')
          Invoke-WebRequest -UseBasicParsing -OutFile bundle.zip "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$enc/multitool-$enc-x86_64-pc-windows-msvc.zip"
          Expand-Archive bundle.zip -DestinationPath bundle
          $want = (Get-FileHash bundle\target\release\multitool.exe).Hash
          $exe = Join-Path $env:LOCALAPPDATA 'harness-multitool\bin\multitool.exe'
          $cargo = $env:VERSION.Split('+')[0]
          function Check($how) {
            $have = (Get-FileHash $exe).Hash
            $said = & $exe --version
            Write-Host "${how}: installed $have, release $want, says: $said"
            if ($have -ne $want) { throw "$how installed another multitool.exe" }
            if ("$said" -ne "multitool $cargo") { throw "$how installed one that says $said" }
            # The daemon it started holds the file: it ends before the next install.
            Get-Process multitool -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            Remove-Item $exe -Force
          }
          & ([scriptblock]::Create((Invoke-RestMethod https://harness-multitool.dev/install.ps1))) -Yes -NoService -NoAgentSetup
          Check "the site's line"
          Invoke-WebRequest -UseBasicParsing -OutFile install.ps1 "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:SHA/install.ps1"
          & .\install.ps1 -Yes -NoService -NoAgentSetup
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          Check 'install.ps1 from GitHub'
          exit 0
